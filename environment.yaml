name: snatacexpress
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python version
  - python=3.8
  
  # Core scientific computing
  - numpy>=1.19.0
  - pandas>=1.2.0
  - scipy>=1.6.0
  
  # Machine learning
  - scikit-learn>=1.0.0
  - xgboost>=1.5.0
  - lightgbm>=3.3.0
  
  # Data handling
  - h5py>=3.6.0
  - pyyaml>=5.4
  
  # Visualization
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  
  # Statistics
  - statsmodels>=0.13.0
  
  # Jupyter
  - jupyter>=1.0.0
  - ipykernel>=6.0.0
  - notebook>=6.4.0
  
  # Utilities
  - joblib>=1.0.0
  - tqdm>=4.62.0
  
  # Development tools (optional but recommended)
  - ipython>=7.30.0
  - black>=22.0.0
  - pylint>=2.12.0
  
  # Additional dependencies
  - typing-extensions>=4.0.0
  
  # For parallel processing
  - dask>=2022.1.0  # optional, for larger datasets
  
  # For SHAP values (if you want to add interpretability)
  - shap>=0.40.0  # optional